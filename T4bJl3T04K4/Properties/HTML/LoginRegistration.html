<!DOCTYPE html>
<html lang="ru">

<head>
   <meta charset="UTF-8">
   <title>Material Compact Login Animation</title>

   <link rel='stylesheet' href='http://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css'>
   <link rel='stylesheet'
      href='http://fonts.googleapis.com/css?family=Roboto:400,100,300,500,700,900&subset=latin,latin-ext'>
   <link rel="stylesheet" href="css/LoginRegistration.css">
</head>

<body>
   <div class="materialContainer">

      <div class="box">
         <div class="title">LOGIN</div>

         <div class="input">
            <label for="name">Username</label>
            <input type="text" name="name" id="name">
            <span class="spin"></span>
         </div>

         <div class="input">
            <label for="pass">Password</label>
            <input type="password" name="pass" id="pass">
            <span class="spin"></span>
         </div>

         <div class="button login">
            <button onclick="sendLogin()"><span>GO</span> <i class="fa fa-check"></i></button>
         </div>

         <a href="#" class="pass-forgot">Forgot your password?</a>
      </div>

      <div class="overbox">
         <div class="material-button alt-2"><span class="shape"></span></div>

         <div class="title">REGISTER</div>

         <div class="input">
            <label for="regname">Username</label>
            <input type="text" name="regname" id="regname">
            <span class="spin"></span>
         </div>

         <div class="input">
            <label for="regpass">Password</label>
            <input type="password" name="regpass" id="regpass">
            <span class="spin"></span>
         </div>

         <div class="input">
            <label for="reregpass">Repeat Password</label>
            <input type="password" name="reregpass" id="reregpass">
            <span class="spin"></span>
         </div>

         <div class="button">
            <button onclick="sendRegister()"><span>NEXT</span></button>
         </div>
      </div>

   </div>

   <script src='http://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
   <script src="js/LoginRegistration.js"></script>

   <script>
      function sendLogin() {
         var username = document.getElementById('name').value;
         var password = document.getElementById('pass').value;
         window.chrome.webview.postMessage({
            action: "login",
            username: username,
            password: password
         });
      }

      function sendRegister() {
         var username = document.getElementById('regname').value;
         var password = document.getElementById('regpass').value;
         var repeatPassword = document.getElementById('reregpass').value;
         window.chrome.webview.postMessage({
            action: "register",
            username: username,
            password: password,
            repeatPassword: repeatPassword
         });
      }
   </script>

</body>

</html>
