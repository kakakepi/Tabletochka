<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Личный кабинет</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/Cabinet.css">
</head>

<body>
    <header>
        <div class="avatar-top" onclick="togglePanel()">
            <i class="fa fa-user"></i>
        </div>
    </header>

    <div class="overlay" onclick="togglePanel()"></div>
    <div class="side-panel" id="sidePanel">
        <div class="menu-title">Меню</div>
        <div class="menu-item"><a href="Main.html">Главная страница</a></div>
        <div class="menu-item"><a href="Сabinet.html">Личный кабинет</a></div>
        <div class="menu-item"><a href="History.html">История поиска</a></div>

        <div class="menu-item" onclick="toggleSubmenu('langSubmenu')">Язык</div>
        <div class="submenu" id="langSubmenu">
            <div>Русский</div>
            <div>Английский</div>
        </div>
        <div class="menu-item" onclick="toggleSubmenu('supportSubmenu')">Техподдержка</div>
        <div class="submenu" id="supportSubmenu">
            <div>ГОРЯЧАЯ линия 24/7</div>
            <div>+79822552998</div>
        </div>
        <div class="menu-item" style="color: red;">Выход</div>
    </div>

    <div class="materialContainer">
        <div class="box">
            <div class="title">Личный кабинет</div>

            <div class="profile-section">
                <div class="profile-pic">
                    <img src="img/avatar.jpg" alt="Аватар">
                </div>
                <div class="profile-actions">
                    <button class="button secondary" id="uploadBtn">
                        <i class="fas fa-upload"></i> Загрузить фото
                    </button>
                    <!-- Предположим, что эта кнопка отвечает за удаление фото -->
                    <button class="button secondary" id="deleteBtn">
                        <i class="fas fa-trash"></i> Удалить фото
                    </button>
                </div>
            </div>

            <form id="profileForm">
                <div class="input-group">
                    <label>Псевдоним</label>
                    <div class="input">
                        <input type="text" id="username" required>
                        <span class="spin"></span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Фамилия</label>
                    <div class="input">
                        <input type="text" id="lastname" required>
                        <span class="spin"></span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Имя</label>
                    <div class="input">
                        <input type="text" id="firstname" required>
                        <span class="spin"></span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Пол</label>
                    <div class="input">
                        <select id="gender">
                            <option value="male">Мужской</option>
                            <option value="female">Женский</option>
                        </select>
                        <span class="spin"></span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Дата рождения</label>
                    <div class="input">
                        <input type="date" id="birthdate" required>
                        <span class="spin"></span>
                    </div>
                </div>

                <label>Смена пароля</label>
                <div class="input-group">
                    <label>Старый пароль</label>
                    <div class="input">
                        <input type="password" id="oldPassword">
                        <span class="spin"></span>
                    </div>
                </div>
                <div class="input-group">
                    <label>Новый пароль</label>
                    <div class="input">
                        <input type="password" id="newPassword">
                        <span class="spin"></span>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="button primary" id="deleteAccountBtn">Удалить аккаунт</button>
                    <button type="button" class="button secondary" id="cancelBtn">Отмена</button>
                    <button type="submit" class="button primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/Cabinet.js"></script>
</body>

</html>
